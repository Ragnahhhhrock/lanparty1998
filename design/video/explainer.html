<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explainer video</title>
<meta name="robots" content="noindex">
<!-- Source for the 59 second explainer video, in two shapes:
       ?fmt=portrait  540x960 CSS px, rendered at 2x = 1080x1920 (TikTok, Reels, Shorts)
       ?fmt=wide      960x540 CSS px, rendered at 2x = 1920x1080 (YouTube)
     Render with: python3 scripts/render-video.py
     Built only from tokens.css and the component rules in STYLEGUIDE.md. The footage in img/video/ is captured
     from the real site (scripts/capture-video.py); the music is "Volt Rush" by DJ Volt, rendered from js/music.js. -->
<link rel="stylesheet" href="../../css/tokens.css">
<style>
  html, body { margin: 0; background: var(--basement); }
  #stage { position: relative; width: 540px; height: 960px; overflow: hidden; background: var(--basement);
    font: var(--text-ui)/var(--leading-ui) var(--font-ui); color: var(--w98-text); }
  .wide #stage, #stage.wide { width: 960px; height: 540px; }
  .scene { position: absolute; inset: 0; display: none; overflow: hidden; }
  .bg { position: absolute; inset: 0; background-size: cover; background-position: center; transform-origin: 50% 50%; }
  .shade { position: absolute; inset: 0; background: var(--vignette); }
  .wall { position: absolute; inset: 0; background:
      var(--vignette),
      repeating-linear-gradient(90deg, var(--wood-dark) 0 3px, transparent 3px 60px),
      repeating-linear-gradient(90deg, var(--drop) 0 14px, transparent 14px 32px, var(--drop) 32px 60px),
      var(--wood); }

  /* ---- Win98 caption window ---- */
  .win { position: absolute; left: 24px; right: 24px; bottom: 150px; background: var(--w98-face); padding: 3px; box-sizing: border-box;
    box-shadow: var(--bevel-raised), var(--drop-shadow); }
  .win .tt { display: flex; justify-content: space-between; align-items: center; background: var(--title-gradient);
    color: var(--w98-light); font-weight: bold; padding: 4px 4px 4px 8px; font-size: 14px; letter-spacing: .02em; }
  .win .tt b { background: var(--w98-face); color: var(--w98-text); width: 18px; height: 16px; line-height: 14px;
    text-align: center; font-size: 14px; box-shadow: var(--bevel-small); }
  .win .bd { padding: 12px 16px 14px; }
  .win h2 { font: var(--text-crt-xl)/.95 var(--font-crt); color: var(--w98-title); margin: 0 0 8px; }
  .win p { margin: 0; font-size: 16px; line-height: 1.3; }
  .win .row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .win .row span { box-shadow: var(--bevel-sunken); padding: 4px 8px; font-size: 13px; }
  .wide .win { left: 32px; right: auto; width: 400px; bottom: 56px; }
  .wide .win.mid { top: 50%; bottom: auto; margin-top: -120px; left: auto; right: 32px; }

  /* ---- CRT ---- */
  .crt { position: absolute; left: 30px; top: 104px; width: 480px; height: 420px; box-sizing: border-box; padding: 22px 22px 46px;
    background: var(--beige); box-shadow: var(--bevel-small), var(--drop-shadow); }
  .crt::after { content: attr(data-pc); position: absolute; left: 22px; bottom: 12px; font: 22px/1 var(--font-crt); color: var(--w98-title-off); }
  .crt i { position: absolute; right: 24px; bottom: 16px; width: 10px; height: 10px; background: var(--phosphor); }
  .wide .crt { left: 36px; top: 36px; width: 540px; height: 440px; }
  .glass { position: relative; height: 100%; background: var(--crt-black); border-radius: 8px / 10px; overflow: hidden;
    box-shadow: inset 0 0 0 3px var(--wood-dark); }
  .glass img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
  .glass::after { content: ""; position: absolute; inset: 0; background: var(--scanlines), var(--vignette); }
  .term { position: absolute; inset: 0; padding: 18px 20px; font: var(--text-crt-md)/1.15 var(--font-crt); color: var(--dos-grey); white-space: pre; }
  .term .t { color: var(--amber); } .term .g { color: var(--phosphor); }
  .cursor { display: inline-block; width: 12px; height: 4px; background: var(--phosphor); }

  /* ---- bits ---- */
  .meters { position: absolute; left: 24px; right: 24px; top: 130px; background: var(--w98-face); box-shadow: var(--bevel-raised), var(--drop-shadow);
    padding: 10px 12px; display: grid; gap: 8px; }
  .wide .meters { left: auto; right: 32px; width: 400px; top: 40px; }
  .meter { display: grid; grid-template-columns: 96px 1fr 52px; align-items: center; gap: 10px; font-size: 13px; font-weight: bold; letter-spacing: .04em; }
  .bar { height: 14px; background: var(--w98-light); box-shadow: var(--bevel-sunken); padding: 3px; }
  .bar b { display: block; height: 100%; }
  .caf { background: repeating-linear-gradient(90deg, var(--volt) 0 8px, transparent 8px 10px); }
  .snk { background: repeating-linear-gradient(90deg, var(--nacho) 0 8px, transparent 8px 10px); }
  .prg { background: repeating-linear-gradient(90deg, var(--w98-title) 0 8px, transparent 8px 10px); }
  .toast { position: absolute; left: 24px; right: 24px; top: 130px; font: var(--text-crt-lg)/1.15 var(--font-crt); color: var(--toast);
    text-shadow: var(--text-shadow-hard); background: var(--hud-bg); padding: 10px 14px; white-space: pre; }
  .wide .toast { left: auto; right: 32px; width: 400px; top: 40px; box-sizing: border-box; }
  .tag { display: inline-block; background: var(--w98-face); box-shadow: var(--bevel-raised); padding: 4px 10px; font-size: 14px; font-weight: bold; margin: 0 4px 6px 0; }
  .stack { position: absolute; left: 24px; right: 24px; top: 130px; }
  .wide .stack { left: auto; right: 32px; width: 400px; top: 40px; }
  #taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--taskbar-h); background: var(--w98-face); box-shadow: var(--bevel-raised);
    display: flex; align-items: center; justify-content: space-between; padding: 0 4px; box-sizing: border-box; z-index: 20; }
  #taskbar .start { box-shadow: var(--bevel-raised); padding: 2px 10px; font-weight: bold; font-size: 13px; }
  #taskbar .tray { box-shadow: var(--bevel-sunken); padding: 1px 10px; font: 20px/1 var(--font-crt); }
  #flash { position: absolute; inset: 0; background: var(--w98-light); opacity: 0; z-index: 30; pointer-events: none; }
  .url { position: absolute; left: 0; right: 0; bottom: 56px; text-align: center; font: var(--text-crt-xl)/1 var(--font-crt); color: var(--phosphor); text-shadow: var(--text-shadow-hard); }
  .wide .url { left: auto; right: 32px; width: 460px; bottom: 56px; text-align: right; }
  .count { position: absolute; right: 12px; top: 10px; font: var(--text-crt-lg)/1 var(--font-crt); color: var(--toast); text-shadow: var(--text-shadow-hard); background: var(--hud-bg); padding: 4px 10px; z-index: 5; }
</style>
</head>
<body>
<div id="stage"><div id="scenes"></div>
  <div id="taskbar"><span class="start">Start</span><span class="tray" id="clock">7:30 PM</span></div>
  <div id="flash"></div>
</div>
<script>
const Q = new URLSearchParams(location.search);
const WIDE = Q.get('fmt') === 'wide';
const DIR = WIDE ? 'w/' : 'p/';
document.getElementById('stage').classList.toggle('wide', WIDE);
document.body.classList.toggle('wide', WIDE);
const A = '../../img/video/';
const GAME_FRAMES = 6;
const q4 = (x) => Math.round(x * 6) / 6; // stepped easing: the era had no tweening
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const typed = (s, lt, cps = 30) => s.slice(0, Math.floor(lt * cps));

const win = (title, h, p, extra = '', cls = '') =>
  `<div class="win cap ${cls}"><div class="tt"><span>${title}</span><b>x</b></div><div class="bd"><h2>${h}</h2><p>${p}</p>${extra}</div></div>`;
const rise = (el, lt, delay = 0.15) => {
  const w = el.querySelector('.cap'); const s = q4(clamp((lt - delay) / 0.3));
  w.style.transform = `translateY(${(1 - s) * 40}px)`; w.style.opacity = s ? 1 : 0;
};

// a footage scene: real stills with a slow push, cycling through one or more pictures, and a caption window
const photo = (imgs, zoom, title, h, p, extra = '', fx = null, cls = '') => {
  const list = [].concat(imgs);
  return {
    html: `${list.map((n) => `<div class="bg" style="background-image:url(${A}${DIR}${n}.jpg)"></div>`).join('')}<div class="shade"></div>${extra}${win(title, h, p, '', cls)}`,
    update(el, lt, d) {
      const k = lt / d, n = Math.min(list.length - 1, Math.floor(k * list.length));
      el.querySelectorAll('.bg').forEach((b, i) => {
        b.style.display = i === n ? 'block' : 'none';
        const kk = list.length > 1 ? (k * list.length) % 1 : k;
        b.style.transform = `scale(${zoom[0] + (zoom[1] - zoom[0]) * kk})`;
      });
      rise(el, lt);
      fx?.(el, lt, d);
    },
  };
};

const GAMES = [
  { id: 'doom', name: 'DOOM', file: 'DOOM.EXE', pc: 'PC-01', line: '1994. The one everyone started with. IPXSETUP finds the other nodes by itself.', tags: ['Shareware', 'IPX deathmatch'] },
  { id: 'heretic', name: 'HERETIC', file: 'HERETIC.EXE', pc: 'PC-02', line: '1995. Same engine, a magic wand and a lot of gargoyles. Up to four players.', tags: ['Shareware', 'IPX deathmatch'] },
  { id: 'hexen', name: 'HEXEN', file: 'HEXEN.EXE', pc: 'PC-03', line: '1995. Pick a class, find the portal, frag your mates.', tags: ['Level demo', 'IPX deathmatch'] },
  { id: 'quake', name: 'QUAKE', file: 'QUAKE.EXE', pc: 'PC-05', line: '1996. Real 3D on a Pentium. Multiplayer, new game, wait for the others.', tags: ['Shareware', 'Network lobby'] },
  { id: 'descent', name: 'DESCENT', file: 'DESCENT.EXE', pc: 'PC-06', line: '1995. Six degrees of freedom and no floor. Start a network game.', tags: ['Shareware', 'Network lobby'] },
  { id: 'duke', name: 'DUKE NUKEM 3D', file: 'DUKE3D.EXE', pc: 'PC-04', line: '1996. Episode one, now playable. Pick the network game in SETUP.', tags: ['Shareware', 'Network lobby'] },
];
const gameScene = (g, i) => ({
  html: `<div class="wall"></div>
    <div class="count">${i + 1} OF ${GAMES.length}</div>
    <div class="crt" data-pc="${g.pc}"><i></i><div class="glass">${Array.from({ length: GAME_FRAMES }, (_, k) => `<img data-k="${k}" src="${A}games/${g.id}_${k}.jpg">`).join('')}</div></div>
    ${win(g.file, g.name, g.line, `<div class="row">${g.tags.map((t) => `<span>${t}</span>`).join('')}</div>`, 'mid')}`,
  update(el, lt) {
    const n = Math.min(GAME_FRAMES - 1, Math.floor(lt * 2.2));
    el.querySelectorAll('.glass img').forEach((im) => { im.style.display = Number(im.dataset.k) === n ? 'block' : 'none'; });
    const c = el.querySelector('.crt'); const s = q4(clamp(lt / 0.25));
    c.style.transform = `scale(${0.9 + 0.1 * s})`; c.style.opacity = s ? 1 : 0;
    rise(el, lt, 0.2);
  },
});

const T = [0, 4, 8, 12, 15, 33, 37, 41, 45, 49, 52.5, 56, 59]; // scene boundaries, seconds
const SCENES = [
  // title
  { t0: T[0], t1: T[1], ...photo('title', [1, 1.15], 'LANPARTY.EXE', "LAN Party '98", 'A basement, six beige boxes and a 10BASE-T hub. Free in your browser.') },
  // build your own PC
  { t0: T[1], t1: T[2], ...photo('wizard', [1, 1.06], 'BUILDPC.EXE', 'Build your own PC', 'Start at the computer shop with $1500: monitor, Pentium, RAM, drives, sound card, the lot.',
      '', (el, lt) => {}) },
  // walk
  { t0: T[2], t1: T[3], ...photo('walk', [1, 1.15], 'WALK.EXE', 'Walk the basement', 'A real 3D room, shared live with everyone else who is online. Add ?room= for a private one.') },
  // sit
  { t0: T[3], t1: T[4], ...photo('sit', [1.1, 1], 'SIT.EXE', 'Sit at any free PC', 'Press E. A DOS machine boots in your browser, and everyone else can watch your game on the glass at your desk.') },
  // games
  ...GAMES.map((g, i) => ({ t0: T[4] + i * 3, t1: T[4] + (i + 1) * 3, ...gameScene(g, i) })),
  // deathmatch
  { t0: T[5], t1: T[6], ...photo('dm', [1, 1.12], 'NETFRAG.EXE', 'Deathmatch with mates', 'Host or join. Up to four PCs find each other over a virtual IPX network.',
      `<div class="toast"><span id="tm"></span></div>`, (el, lt) => {
        const lines = ['C:\\> IPXSETUP -nodes 4', 'Players found: ' + (lt > 2.4 ? '4 of 4' : lt > 1.6 ? '3 of 4' : '2 of 4')];
        el.querySelector('#tm').textContent = lines[0] + '\n' + (lt > 0.8 ? lines[1] : ''); }) },
  // bench
  { t0: T[6], t1: T[7], ...photo('bench', [1, 1.12], 'BENCH.EXE', 'Then build it for real', 'Carry the parts to the back table, plug in every lead from behind, press the button and watch it POST.',
      `<div class="stack"><span class="tag">PC-07 / PC-08</span><span class="tag">Power + network leads</span><span class="tag">POST</span></div>`) },
  // logistics
  { t0: T[7], t1: T[8], ...photo('power', [1.1, 1], 'NETWORK.EXE', 'Keep the night running', 'Coax drops out, so buy a hub. RAM from Singapore, overclocks, a pedestal fan, CD-ROM trays and a yellow extension lead to trip on.',
      `<div class="stack"><span class="tag">10BASE2 coax</span><span class="tag">$45 hub</span><span class="tag" id="ram">RAM 16MB</span><span class="tag" id="mhz">BUS 100MHz</span></div>`, (el, lt) => {
        el.querySelector('#ram').textContent = 'RAM ' + (lt > 2.6 ? '64MB' : lt > 1.3 ? '32MB' : '16MB');
        el.querySelector('#mhz').textContent = 'BUS ' + (lt > 3 ? '112MHz' : '100MHz'); }) },
  // desktop
  { t0: T[8], t1: T[9], ...photo(['desk1', 'desk2', 'desk3'], [1, 1.06], 'DESKTOP.EXE', 'A whole 98 desktop', 'Internet Explorer on the party site, #lanparty98 chat, LANamp, Snapster, Minesweeper, Solitaire and Downhill.') },
  // food + phone
  { t0: T[9], t1: T[10], ...photo(['food', 'phone'], [1, 1.1], 'SNACKS.EXE', 'Pizza Shack, Volt Cola, a Nokka 51', 'Ring Pizza Shack and the driver knocks. Snacks have meters. The mobile has Snake.',
      `<div class="meters"><div class="meter"><span>CAFFEINE</span><div class="bar"><b class="caf" id="mc"></b></div><span id="mcv"></span></div>
        <div class="meter"><span>SNACKS</span><div class="bar"><b class="snk" id="ms"></b></div><span id="msv"></span></div></div>`, (el, lt) => {
        const c = Math.round(10 + 80 * clamp(lt / 3)), s = Math.round(10 + 62 * clamp(lt / 3.2));
        el.querySelector('#mc').style.width = c + '%'; el.querySelector('#ms').style.width = s + '%';
        el.querySelector('#mcv').textContent = c + '%'; el.querySelector('#msv').textContent = s + '%'; }) },
  // lounge
  { t0: T[10], t1: T[11], ...photo(['lounge', 'shelf'], [1, 1.1], 'LOUNGE.EXE', 'Couch, console, game shelf', 'A plaid couch, a four-player console, posters, a box for every game and a man taped to the ceiling.') },
  // CTA
  { t0: T[11], t1: T[12], html: `<div class="wall"></div>
    <div class="crt" data-pc="PC-01" style="${WIDE ? '' : 'top:90px;height:330px'}"><i></i><div class="glass"><div class="term" id="cta"></div></div></div>
    ${win('LANPARTY.EXE', "LAN Party '98", 'Free in your browser. News, games and how to play at lanparty1998.com/news. Sign up for a party reminder.', '', WIDE ? 'mid' : '')}
    <div class="url">lanparty1998.com</div>`,
    update(el, lt) {
      const l = ['C:\\> NETFRAG', 'IPX NETWORK GAME', '', 'Players found: 5 of 6', lt > 1.2 ? 'Waiting for PC-04...' : '', '', 'C:\\> '];
      el.querySelector('#cta').innerHTML = l.map((s, i) => (i === 1 ? `<span class="t">${s}</span>` : i === 4 ? `<span class="g">${s}</span>` : s)).join('\n') + (Math.floor(lt * 2) % 2 ? '<span class="cursor"></span>' : '');
      rise(el, lt, 0.1);
      if (!WIDE) el.querySelector('.cap').style.bottom = '150px';
      else el.querySelector('.cap').style.bottom = '';
    } },
];

const root = document.getElementById('scenes');
SCENES.forEach((s) => { const d = document.createElement('div'); d.className = 'scene'; d.innerHTML = s.html; root.appendChild(d); s.el = d; });

function clockText(t) { // 7:30 PM at 0s, midnight at the end of the games
  const m = 19 * 60 + 30 + (clamp(t / 59)) * 270; const h24 = Math.floor(m / 60) % 24, mm = Math.floor(m % 60);
  return `${((h24 + 11) % 12) + 1}:${String(mm).padStart(2, '0')} ${h24 >= 12 ? 'PM' : 'AM'}`;
}
window.DURATION = T[T.length - 1];
window.seek = (t) => {
  let cut = 0;
  for (const s of SCENES) {
    const on = t >= s.t0 && t < s.t1;
    s.el.style.display = on ? 'block' : 'none';
    if (on) { s.update?.(s.el, t - s.t0, s.t1 - s.t0); cut = Math.max(cut, 1 - (t - s.t0) / 0.12); }
  }
  document.getElementById('flash').style.opacity = t < 0.1 ? 0 : clamp(cut) * 0.55;
  document.getElementById('clock').textContent = clockText(t);
};
window.preload = () => {
  const urls = [...document.querySelectorAll('.bg')].map((e) => e.style.backgroundImage.slice(5, -2))
    .concat([...document.querySelectorAll('.glass img')].map((i) => i.src));
  return Promise.all(urls.map((u) => new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = u; })).concat([document.fonts.ready]));
};
seek(0);
</script>
</body>
</html>
