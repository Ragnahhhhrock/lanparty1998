<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social card template</title>
<meta name="robots" content="noindex">
<!-- Source for img/og-image.png (1200×630) and img/twitter-card.png (1200×600).
     Render with: python3 scripts/render-social.py
     Built only from tokens.css and the component rules in STYLEGUIDE.md. -->
<link rel="stylesheet" href="../../css/tokens.css">
<style>
  html, body { margin: 0; background: var(--basement); }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    font: var(--text-ui)/var(--leading-ui) var(--font-ui); color: var(--w98-text);
    /* basement wall: vertical wood boards with grooves */
    background:
      var(--vignette),
      repeating-linear-gradient(90deg, var(--wood-dark) 0 3px, transparent 3px 75px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 18px, rgba(255,255,255,.03) 18px 40px, rgba(0,0,0,.1) 40px 75px),
      var(--wood);
  }
  .card.twitter { height: 600px; }
  .card::after { /* carpet strip along the floor */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 54px;
    background: radial-gradient(circle, rgba(120,40,40,.35) 1px, transparent 1.5px) 0 0 / 7px 7px, var(--carpet);
    box-shadow: 0 -8px 0 var(--wood-dark);
  }

  /* ---- Win98 window ---- */
  .w98-window { position: absolute; left: 64px; top: 64px; width: 600px; z-index: 2;
    background: var(--w98-face); box-shadow: var(--bevel-raised), 10px 10px 0 rgba(0,0,0,.45); padding: 3px; }
  .w98-title { display: flex; justify-content: space-between; align-items: center;
    background: var(--title-gradient); color: var(--w98-light); font-weight: bold;
    padding: 5px 6px 5px 10px; font-size: 18px; letter-spacing: .02em; }
  .w98-title b { background: var(--w98-face); color: var(--w98-text); width: 24px; height: 21px; line-height: 19px;
    text-align: center; font-size: 18px; box-shadow: var(--bevel-small); }
  .w98-body { padding: 18px 28px 26px; }
  h1 { font: 124px/.85 var(--font-crt); color: var(--w98-title); margin: 0 0 18px; letter-spacing: -.01em; }
  p { font-size: 25px; line-height: 1.3; margin: 0; max-width: 30ch; }
  .status { display: flex; gap: 4px; margin-top: 22px; }
  .status span { box-shadow: var(--bevel-sunken); padding: 5px 10px; font-size: 17px; }
  .status span:first-child { flex: 1; }

  /* ---- CRT ---- */
  .crt { position: absolute; right: 64px; top: 92px; width: 420px; height: 360px; z-index: 1;
    background: linear-gradient(160deg, var(--beige-light), var(--beige) 60%, #b8ae94);
    box-shadow: var(--bevel-small), 14px 14px 0 rgba(0,0,0,.45); padding: 26px 26px 52px; box-sizing: border-box; }
  .crt::after { content: "PC-01"; position: absolute; left: 26px; bottom: 16px; font: 22px/1 var(--font-crt); color: #6b6350; }
  .crt i { position: absolute; right: 28px; bottom: 20px; width: 12px; height: 12px; background: var(--phosphor);
    box-shadow: 0 0 10px var(--phosphor); }
  .glass { position: relative; height: 100%; background: var(--crt-black); border-radius: 14px / 18px; overflow: hidden;
    box-shadow: inset 0 0 0 4px #1b1a16; padding: 22px 24px; box-sizing: border-box;
    font: 30px/1.12 var(--font-crt); color: var(--dos-grey); }
  .glass::after { content: ""; position: absolute; inset: 0; background: var(--scanlines), var(--vignette);
    box-shadow: inset 0 0 50px rgba(120,255,200,.08); }
  .glass .t { color: var(--amber); }
  .glass .g { color: var(--phosphor); }
  .cursor { display: inline-block; width: 15px; height: 4px; background: var(--phosphor); vertical-align: baseline; }

  /* ---- HUD meters ---- */
  .meters { position: absolute; right: 64px; bottom: 92px; width: 300px; z-index: 3;
    background: var(--w98-face); box-shadow: var(--bevel-raised); padding: 12px 14px; display: grid; gap: 8px; }
  .twitter .meters { bottom: 80px; }
  .meter { display: grid; grid-template-columns: 104px 1fr; align-items: center; gap: 10px;
    font-size: 15px; font-weight: bold; letter-spacing: .04em; }
  .bar { height: 15px; background: var(--w98-light); box-shadow: var(--bevel-sunken); padding: 3px; }
  .bar b { display: block; height: 100%; }
  .caf { width: 82%; background: repeating-linear-gradient(90deg, var(--volt) 0 10px, transparent 10px 13px); }
  .snk { width: 64%; background: repeating-linear-gradient(90deg, var(--nacho) 0 10px, transparent 10px 13px); }
  .clock { font: 28px/1 var(--font-crt); text-align: right; }

  /* ---- Domain plate ---- */
  .domain { position: absolute; left: 64px; bottom: 14px; z-index: 3; font: 34px/1 var(--font-crt); color: var(--phosphor);
    text-shadow: var(--text-shadow-hard); }
  .domain::before { content: "C:\\> "; color: var(--dos-grey); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="w98-window">
    <div class="w98-title"><span>LANPARTY.EXE</span><b>×</b></div>
    <div class="w98-body">
      <h1>LAN Party '98</h1>
      <p>Six beige boxes, one 10BASE-T hub and a crate of Volt Cola. Sit down and frag.</p>
      <div class="status"><span>Play free in your browser</span><span>IPX ready</span></div>
    </div>
  </div>

  <div class="crt"><i></i>
    <div class="glass">
      <div>C:\&gt; NETFRAG</div>
      <div class="t">IPX NETWORK GAME</div>
      <div>&nbsp;</div>
      <div>Players found: 5 of 6</div>
      <div class="g">Waiting for PC-04…</div>
      <div>&nbsp;</div>
      <div class="g">C:\&gt; <span class="cursor"></span></div>
    </div>
  </div>

  <div class="meters">
    <div class="meter"><span>CAFFEINE</span><div class="bar"><b class="caf"></b></div></div>
    <div class="meter"><span>SNACKS</span><div class="bar"><b class="snk"></b></div></div>
    <div class="clock">11:42 PM</div>
  </div>

  <div class="domain">lanparty1998.com</div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('variant') === 'twitter') document.getElementById('card').classList.add('twitter');
</script>
</body>
</html>
